<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vaatwassers vergelijken</title>
<style>
:root{
  --bg:#f1f4f6; --card:#ffffff; --ink:#15222b; --muted:#5d6c76; --line:#dde3e8;
  --brand:#1b4fd8; --brand-d:#143bab; --brand-soft:#e6edfd;
  --good:#1c7a52; --good-soft:#e2f3ea; --mid:#1f7f8e; --mid-soft:#e0f1f3; --warn:#a8650b; --warn-soft:#fbeed6;
  --r:14px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Inter","Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top-in{max-width:1080px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:20px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.01em}
.logo i{width:30px;height:30px;border-radius:9px;background:var(--brand);display:grid;place-items:center}
.logo i:before{content:"";width:14px;height:14px;border:3px solid #fff;border-radius:50%;border-top-color:transparent;transform:rotate(30deg)}
.search{flex:1;max-width:380px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:8px 16px;color:var(--muted);font-size:14px}
.top-r{margin-left:auto;display:flex;align-items:center;gap:14px}
.chip-z{display:inline-flex;gap:6px;align-items:center;background:var(--good-soft);color:var(--good);font-weight:600;font-size:13px;padding:6px 12px;border-radius:999px;animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.cart{position:relative;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:14px}
.cart b{background:var(--brand);color:#fff;border-radius:999px;padding:0 7px;margin-left:6px;font-size:12px}
main{max-width:1080px;margin:0 auto;padding:24px 20px 64px}
.crumb{color:var(--muted);font-size:13px;margin-bottom:6px}
h1{font-size:28px;line-height:1.2;letter-spacing:-.02em;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.f{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--muted)}
.f.on{border-color:var(--brand);color:var(--brand);background:var(--brand-soft);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.card .pic{background:linear-gradient(180deg,#eef2f5,#e3e9ee);padding:18px 0 8px;display:grid;place-items:center;height:210px}
.card .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.name{font-weight:700;font-size:17px}
.price{font-weight:700;font-size:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--bg);border-radius:8px;padding:3px 9px;font-size:12.5px;color:var(--muted)}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:600;background:var(--brand);color:#fff}
.btn:hover{background:var(--brand-d)}
.btn.ghost{background:#fff;color:var(--brand);border:1.5px solid var(--brand)}
.btn.ghost:hover{background:var(--brand-soft)}
.btn.wide{width:100%}
.card .btn{margin-top:auto}
/* score badge */
.mes{display:flex;gap:12px;align-items:center;border-radius:12px;padding:10px 12px;border:1px solid}
.mes .t{display:flex;flex-direction:column;line-height:1.25}
.mes .t small{font-size:12px;color:var(--muted)}
.mes .t b{font-size:15px}
.mes .t span{font-size:12.5px;color:var(--ink)}
.lv-good{background:var(--good-soft);border-color:#bfe3cf}.lv-good b{color:var(--good)}
.lv-mid{background:var(--mid-soft);border-color:#bddde2}.lv-mid b{color:var(--mid)}
.lv-warn{background:var(--warn-soft);border-color:#efd5a5}.lv-warn b{color:var(--warn)}
.mes.big{padding:14px 16px}.mes.big .t b{font-size:18px}
button.mes{width:100%;text-align:left;font:inherit;color:inherit}
button.mes:hover{filter:brightness(.98)}
/* product page */
.pp{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
.pp .pic{background:linear-gradient(180deg,#eef2f5,#e3e9ee);border-radius:var(--r);padding:30px 0 14px;display:grid;place-items:center}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.stack{display:flex;flex-direction:column;gap:14px}
.back{background:none;border:0;color:var(--brand);padding:0;margin-bottom:14px;font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 14px}
.tab{background:none;border:0;padding:9px 14px;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--ink);border-color:var(--brand)}
table.sp{width:100%;border-collapse:collapse}
table.sp td{padding:9px 0;border-bottom:1px solid var(--line)}
table.sp td:last-child{text-align:right;font-weight:600}
.norm{display:flex;gap:10px;align-items:center;color:var(--ink);font-size:14px}
.norm svg{flex:none}
.steps{display:flex;flex-direction:column;gap:10px;margin:0 0 16px;padding:0;list-style:none}
.steps li{display:flex;gap:12px;align-items:flex-start;background:var(--bg);border-radius:10px;padding:10px 12px}
.steps .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.steps small{color:var(--muted);display:block}
.act{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.act .btn{padding:7px 12px;font-size:14px}
.act.done{background:var(--good-soft);border-color:#bfe3cf}
.act.done .btn{background:none;color:var(--good);cursor:default}
.cta{display:flex;gap:10px;margin-top:18px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:500;box-shadow:0 8px 28px rgba(0,0,0,.25);animation:up .3s ease-out;max-width:90vw;z-index:20}
@keyframes up{from{transform:translate(-50%,16px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
/* full screens */
.center{max-width:600px;margin:40px auto}
.center h1{margin-bottom:10px}
.scn{background:var(--brand-soft);border-radius:12px;padding:14px 16px;margin:16px 0;font-weight:500}
.q{margin:20px 0}.q p{margin:0 0 8px;font-weight:600}
.scale{display:flex;gap:6px;flex-wrap:wrap}
.scale label{flex:1;min-width:44px}
.scale input{position:absolute;opacity:0}
.scale span{display:grid;place-items:center;height:42px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-weight:600}
.scale input:checked+span{background:var(--brand);border-color:var(--brand);color:#fff}
.scale input:focus-visible+span{outline:3px solid var(--brand);outline-offset:2px}
.ends{display:flex;justify-content:space-between;color:var(--muted);font-size:12.5px;margin-top:4px}
.opt{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;margin-bottom:8px}
.opt input{accent-color:var(--brand)}
.opt:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.muted{color:var(--muted)}
.note{font-size:13px;color:var(--muted)}
.dbg{position:fixed;right:8px;bottom:8px;background:#000;color:#fff;font-size:11px;padding:3px 8px;border-radius:6px;opacity:.7}
@media (max-width:820px){.pp{grid-template-columns:1fr}.search{display:none}}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.lbl{font-size:12.5px;color:var(--muted)}
.norm{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:13.5px}
.norm svg{flex:none}
table.sp{width:100%;border-collapse:collapse}
table.sp td{padding:9px 0;border-bottom:1px solid var(--line)}
table.sp td:last-child{text-align:right;font-weight:600}
.err{color:#b3261e;font-size:13px;margin:6px 0 0}
.hide{display:none}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===== Instellingen ===== */
const CONFIG = {
  studyId: 'mes-ronde2',
  endpoint: 'https://script.google.com/macros/s/AKfycbxAjrqSXUSl2JyYk4K6M9M4_HynqyY6xDGHR8rdVB_itWGfKXY-5ZGSDvHosN2V4Yj7/exec',            // plak hier de URL van je Google Apps Script web-app
  arms: ['A','Z']          // arm voor bezoekers zonder ?arm= in de link; C bestaat via ?arm=C
};
/* C = controle (geen label), Z = label per vaatwasser, A = label + sociale norm op de productpagina */

const params = new URLSearchParams(location.search);
let arm = params.get('arm');
if(!['C','A','Z'].includes(arm)){
  /* zonder ?arm= in de link: eenmalig willekeurig, daarna vast per browser (ook na verversen).
     ?arms=ZC kiest willekeurig tussen Z en C, ?arms=AZ tussen A en Z, enz. */
  const pool = (params.get('arms')||'').toUpperCase().split('').filter((c,i,a)=>'CAZ'.includes(c)&&a.indexOf(c)===i);
  const opts = pool.length>1 ? pool : CONFIG.arms;
  /* testmodus (&debug): elke keer opnieuw loten en niets opslaan */
  const isDebug = params.has('debug');
  try{ arm = isDebug ? null : localStorage.getItem('mes_arm'); }catch(_){ arm = null; }
  if(!opts.includes(arm)){
    arm = opts[Math.floor(Math.random()*opts.length)];
    if(!isDebug){ try{ localStorage.setItem('mes_arm', arm); }catch(_){} }
  }
}
const debug = params.has('debug');
const pid = 'p' + Math.random().toString(36).slice(2,9);
const T0 = Date.now(), events = [];

function log(type, data){
  const e = Object.assign({study:CONFIG.studyId, pid, arm, type, t:+((Date.now()-T0)/1000).toFixed(1)}, debug?{debug:true}:{}, data||{});
  events.push(e);
  try{ localStorage.setItem('mes_'+pid, JSON.stringify(events)); }catch(_){}
  if(CONFIG.endpoint){ try{ fetch(CONFIG.endpoint,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(e)}); }catch(_){} }
}

/* ===== Stimuli (fictief, vaste volgorde) ===== */
const MODELS = [
  {id:'A',price:349, cap:12,db:'Stil',       lab:'D',prog:5,tone:0,label:'Onderhoud: 20 min per maand'},
  {id:'B',price:449, cap:13,db:'Stil',       lab:'D',prog:5,tone:1,label:'Onderhoud: 15 min per maand'},
  {id:'C',price:549, cap:14,db:'Zeer stil',  lab:'C',prog:6,tone:2,label:'Onderhoud: 5 min per maand'},
  {id:'D',price:699, cap:14,db:'Zeer stil',  lab:'C',prog:7,tone:0,label:'Onderhoud: 8 min per maand'},
  {id:'E',price:899, cap:15,db:'Extreem stil',lab:'B',prog:8,tone:1,label:'Onderhoud: 10 min per maand'},
  {id:'F',price:1099,cap:15,db:'Extreem stil',lab:'B',prog:9,tone:2,label:'Onderhoud: 25 min per maand'}
];
const eur = n => '€ ' + n.toLocaleString('nl-NL');
const hasLabel = () => arm==='A' || arm==='Z';

/* ===== Illustraties ===== */
function dishwasher(m, w){
  const tones=[['#f4f6f8','#d9e0e6'],['#e9edf0','#c5cfd7'],['#dfe4e8','#b9c4cd']][m.tone];
  const k = 'g'+m.id+w;
  return `<svg width="${w}" height="${Math.round(w*1.1)}" viewBox="0 0 200 220" role="img" aria-label="Model ${m.id}">
  <defs><linearGradient id="${k}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${tones[0]}"/><stop offset="1" stop-color="${tones[1]}"/></linearGradient></defs>
  <ellipse cx="100" cy="212" rx="78" ry="6" fill="#000" opacity=".08"/>
  <rect x="22" y="12" width="156" height="192" rx="12" fill="url(#${k})" stroke="#aab6c0" stroke-width="1.5"/>
  <rect x="30" y="20" width="140" height="26" rx="6" fill="#2a3945"/>
  <rect x="38" y="28" width="34" height="10" rx="3" fill="#7fd1c0" opacity=".9"/>
  <circle cx="132" cy="33" r="5" fill="#cfd8df"/><circle cx="148" cy="33" r="5" fill="#cfd8df"/><circle cx="116" cy="33" r="5" fill="#cfd8df"/>
  <rect x="30" y="54" width="140" height="140" rx="8" fill="none" stroke="#aab6c0" stroke-width="1.2"/>
  <rect x="48" y="66" width="104" height="9" rx="4.5" fill="#8d9ba6"/>
  <rect x="58" y="176" width="84" height="6" rx="3" fill="#b4c0c9"/>
  <rect x="34" y="204" width="14" height="5" rx="2" fill="#8d9ba6"/><rect x="152" y="204" width="14" height="5" rx="2" fill="#8d9ba6"/>
  </svg>`;
}

/* ===== State ===== */
const S = {screen:'intro', model:null, submitted:false};
const $app = document.getElementById('app');
const M = id => MODELS.find(m=>m.id===id);

function header(){
  return `<header class="top"><div class="top-in"><div class="logo"><i></i>Vaatwassers</div><div class="search">Zoek een model of kenmerk</div>
  <div class="top-r"><span class="cart">Winkelmand<b>0</b></span></div></div></header>`;
}
const chips = (m, withLabel=true) => `<div class="chips"><span class="chip">${m.cap} couverts</span><span class="chip">${m.db}</span><span class="chip">Energielabel ${m.lab}</span>${withLabel&&hasLabel()?`<span class="chip">${m.label}</span>`:''}</div>`;

/* ===== Schermen ===== */
function intro(){
  return `<header class="top"><div class="top-in"><div class="logo"><i></i>Onderzoek</div></div></header>
  <main><div class="center"><h1>Een nieuwe vaatwasser kiezen</h1>
  <p class="muted">We onderzoeken hoe mensen online apparaten vergelijken. Je bekijkt een fictieve webshop; er wordt niets gekocht. Dit duurt ongeveer 3 minuten.</p>
  <div class="scn">Stel je voor: je moet een nieuwe vrijstaande vaatwasser van 60 cm kopen en je betaalt die zelf uit eigen portemonnee. Bekijk de modellen en kies degene die je zou kopen.</div>
  <p class="note">Je antwoorden zijn anoniem. Je kunt op elk moment stoppen door dit venster te sluiten.</p>
  <button class="btn" data-a="start">Start</button></div></main>`;
}

function listing(){
  const cards = MODELS.map(m=>
    `<article class="card"><div class="pic">${dishwasher(m,150)}</div><div class="body">
      <div class="row"><span class="name">Model ${m.id}</span><span class="price">${eur(m.price)}</span></div>
      ${chips(m)}
      <button class="btn ghost" data-a="open" data-m="${m.id}">Toelichting specificaties</button></div></article>`).join('');
  return `${header()}<main><div class="crumb">Huishoudelijke apparaten › Vaatwassers</div><h1>Vaatwassers 60 cm</h1><p class="sub">6 modellen, gesorteerd op prijs (laag naar hoog)</p>
  <div class="filters"><span class="f on">60 cm</span><span class="f on">Vrijstaand</span><span class="f">Prijs</span><span class="f">Energielabel</span><span class="f">Geluid</span></div>
  <div class="grid">${cards}</div></main>`;
}

function product(){
  const m=M(S.model);
  const spec = `<table class="sp"><tr><td>Capaciteit</td><td>${m.cap} couverts</td></tr><tr><td>Geluidsniveau</td><td>${m.db}</td></tr><tr><td>Energielabel</td><td>${m.lab}</td></tr><tr><td>Programma's</td><td>${m.prog}</td></tr><tr><td>Breedte</td><td>60 cm</td></tr>${hasLabel()?`<tr><td>Onderhoud</td><td>${m.label}</td></tr>`:''}</table>`;
  const norm = arm==='A' ? `<div class="norm"><svg width="34" height="22" viewBox="0 0 34 22" aria-hidden="true"><circle cx="9" cy="7" r="4.5" fill="#5d6c76"/><circle cx="25" cy="7" r="4.5" fill="#5d6c76"/><path d="M1 21c0-5 3.6-8 8-8s8 3 8 8zM17 21c0-5 3.6-8 8-8s8 3 8 8z" fill="#5d6c76" opacity=".85"/></svg><span>6 van de 10 kopers van dit model doet het onderhoud volgens de handleiding.</span></div>` : '';
  return `${header()}<main><button class="back" data-a="back">‹ Terug naar overzicht</button>
  <div class="pp"><div class="pic">${dishwasher(m,260)}</div>
  <div class="stack"><div class="panel stack"><div class="row"><h1 style="margin:0">Model ${m.id}</h1><span class="price" style="font-size:24px">${eur(m.price)}</span></div>
  ${chips(m,false)}${norm}
  <div>${spec}</div>
  <div class="cta"><button class="btn wide" data-a="choose">Kies dit model</button></div></div></div></div></main>`;
}

const checks = (name, items) => items.map(([v,t])=>`<label class="opt"><input type="checkbox" name="${name}" value="${v}"> ${t}</label>`).join('');
const radios = (name, items) => items.map(([v,t])=>`<label class="opt"><input type="radio" name="${name}" value="${v}"> ${t}</label>`).join('');

function quest(){
  const m=M(S.model);
  return `<header class="top"><div class="top-in"><div class="logo"><i></i>Onderzoek</div></div></header><main><div class="center">
  <h1>Je koos Model ${m.id}</h1><p class="muted">Nog vier korte vragen. Je kunt terug naar de vaatwasser als je nog iets wilt bekijken.</p>
  <form id="qf" novalidate>
  <div class="q"><p>Welke onderdelen speelden een rol bij het maken van je keuze? Vink alles aan wat van toepassing is.</p>
    ${checks('factoren',[['prijs','Prijs'],['capaciteit','Capaciteit'],['geluid','Geluidsniveau'],['energielabel','Energielabel'],['programmas','Aantal programma\'s'],['anders','Anders']])}
    <div class="err hide" id="e1">Kies minstens één antwoord.</div></div>
  <div class="q"><p>Speelde het onderhoud van de vaatwasser een rol bij jouw keuze voor deze specifieke vaatwasser?</p>
    ${radios('onderhoud',[['ja','Ja'],['nee','Nee']])}
    <div class="err hide" id="e2">Kies een antwoord.</div></div>
  <div class="q hide" id="why"><p>Waarom speelde onderhoud een rol bij je keuze? Vink alles aan wat van toepassing is.</p>
    ${checks('redenen',[['tijd','Het scheelt tijd en moeite'],['levensduur','Het verlengt de levensduur'],['kosten','Het bespaart kosten'],['prestaties','Het apparaat blijft goed presteren'],['zorg','Ik wil goed zorgen voor mijn spullen'],['milieu','Het is beter voor het milieu'],['informatie','De informatie over onderhoud viel me op'],['anders','Anders']])}
    <div class="err hide" id="e3">Kies minstens één antwoord.</div></div>
  <div class="q"><p>Weet je welk onderhoud er aan een vaatwasser gedaan moet worden?</p>
    ${radios('weet',[['ja','Ja'],['ongeveer','Ongeveer'],['nee','Nee']])}
    <div class="err hide" id="e4">Kies een antwoord.</div></div>
  <div class="q"><p>Hoe vaak maak jij de rubbers en het filter van je afwasmachine schoon?</p>
    ${radios('schoonmaak',[['wekelijks','Elke week'],['maandelijks','Elke maand'],['paar_per_jaar','Een paar keer per jaar'],['jaarlijks_of_minder','Eén keer per jaar of minder'],['nooit','Nooit'],['geen','Ik heb geen afwasmachine']])}
    <div class="err hide" id="e5">Kies een antwoord.</div></div>
  <div class="cta"><button class="btn ghost" type="button" data-a="back">‹ Terug naar de vaatwasser</button><button class="btn" type="submit">Verstuur</button></div></form></div></main>`;
}
function done(){
  return `<header class="top"><div class="top-in"><div class="logo"><i></i>Onderzoek</div></div></header><main><div class="center">
  <h1>Bedankt voor je deelname</h1>
  <p>Het doel was onderzoeken welke factoren mensen meenemen bij het kiezen van een vaatwasser en of informatie over onderhoud daarbij een rol speelt. De webshop en de modellen waren fictief; er is niets verkocht.</p>
  <p class="muted">Je antwoorden zijn anoniem. Je mag nu het venster sluiten.</p>
  ${debug?`<p class="note">Testmodus: <a href="#" data-a="dl">log downloaden</a></p>`:''}</div></main>`;
}

function render(){
  const html = ({intro,listing,product,quest,done})[S.screen]();
  $app.innerHTML = html + (debug?`<div class="dbg">arm ${arm} · ${pid} · logging: ${CONFIG.endpoint?'adres ingesteld':'GEEN ADRES (alleen lokaal)'}</div>`:'');
}

/* ===== Gedrag ===== */
function go(screen, model){
  if(model) S.model=model;
  S.screen=screen;
  history.pushState({screen:S.screen, model:S.model}, '');
  render(); window.scrollTo(0,0);
}
history.replaceState({screen:'intro', model:null}, '');
window.addEventListener('popstate', e=>{
  if(S.submitted){ history.pushState({screen:'done', model:S.model}, ''); S.screen='done'; render(); return; }
  const st = e.state || {screen:'intro', model:null};
  S.screen = st.screen; S.model = st.model; render(); window.scrollTo(0,0);
});
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-a]'); if(!el) return;
  const a = el.dataset.a;
  if(a==='dl'){ e.preventDefault(); const b=new Blob([JSON.stringify(events,null,1)],{type:'application/json'}); const u=URL.createObjectURL(b); const x=document.createElement('a'); x.href=u; x.download=pid+'.json'; x.click(); return; }
  if(a==='start') go('listing');
  else if(a==='open') go('product', el.dataset.m);
  else if(a==='back') history.back();
  else if(a==='choose') go('quest');
});
document.addEventListener('change', e=>{
  const g={factoren:'e1',onderhoud:'e2',redenen:'e3',weet:'e4',schoonmaak:'e5'}[e.target.name];
  if(g) document.getElementById(g).classList.add('hide');
  if(e.target.name==='onderhoud'){ document.getElementById('why').classList.toggle('hide', e.target.value!=='ja'); }
});
document.addEventListener('submit', e=>{
  if(e.target.id!=='qf') return; e.preventDefault();
  const f=new FormData(e.target);
  const factoren=f.getAll('factoren'), redenen=f.getAll('redenen');
  const onderhoud=f.get('onderhoud'), weet=f.get('weet'), schoonmaak=f.get('schoonmaak');
  const bad = {e1:!factoren.length, e2:!onderhoud, e3:onderhoud==='ja' && !redenen.length, e4:!weet, e5:!schoonmaak};
  let first=null;
  Object.keys(bad).forEach(k=>{ const el=document.getElementById(k); el.classList.toggle('hide', !bad[k]); if(bad[k] && !first) first=el; });
  if(first){ first.scrollIntoView({block:'center'}); return; }
  log('vragenlijst',{model:S.model, factoren:factoren.join('+'), onderhoud, redenen:onderhoud==='ja'?redenen.join('+'):'', weet, schoonmaak});
  if(S.submitted) return;
  S.submitted=true; go('done');
});
render();
</script>
</body>
</html>
